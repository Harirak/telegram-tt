# repo root: nginx.conf
# Dockerfile: COPY nginx.conf /etc/nginx/conf.d/default.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # ---------- compression ----------
    gzip on;
    gzip_proxied any;          # required: requests arrive via cloudflared
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm;

    # ---------- MTProto WebSocket relay ----------
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # /tgws/2/apiws  ->  wss://zws2.web.telegram.org/apiws
    location ~ ^/tgws/(?<dcid>[1-5])(?<rest>/.*)$ {
        proxy_pass https://zws$dcid.web.telegram.org$rest;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       zws$dcid.web.telegram.org;
        proxy_set_header Origin     "https://web.telegram.org";

        # don't forward the browser's real IP upstream
        proxy_set_header X-Forwarded-For  "";
        proxy_set_header CF-Connecting-IP "";

        proxy_ssl_server_name on;
        proxy_ssl_name zws$dcid.web.telegram.org;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        access_log off;
    }

    # ---------- caching ----------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /version.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
